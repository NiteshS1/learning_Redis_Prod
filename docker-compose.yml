services:
  postgres:
    image: postgres:18-alpine
    container_name: todo-postgres

    restart: unless-stopped

    environment:
      POSTGRES_USER: todo_user
      POSTGRES_PASSWORD: todo_password
      POSTGRES_DB: todo_db

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U todo_user -d todo_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis-primary:
    image: redis:8-alpine
    container_name: todo-redis-primary
    restart: unless-stopped

    environment:
      REDISCLI_AUTH: "${REDIS_PASSWORD}"

    command:
      [
        "redis-server",
        "/usr/local/etc/redis/redis.conf",
      ]

    ports:
      - "6379:6379"

    volumes:
      - redis_data:/data
      - ./redis/primary.conf:/usr/local/etc/redis/redis.conf:ro

    healthcheck:
      test: ["CMD", "redis-cli",  "-p", "6379", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis-replica-1:
    image: redis:8-alpine
    container_name: todo-redis-replica-1
    restart: unless-stopped

    environment:
      REDISCLI_AUTH: "${REDIS_PASSWORD}"

    command:
      [
        "redis-server",
        "/usr/local/etc/redis/redis.conf",
      ]

    depends_on:
      redis-primary:
        condition: service_healthy

    ports:
      - "6380:6380"

    volumes:
      - redis_replica_1_data:/data
      - ./redis/replica-1.conf:/usr/local/etc/redis/redis.conf:ro

    healthcheck:
      test: ["CMD", "redis-cli",  "-p", "6380", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis-replica-2:
    image: redis:8-alpine
    container_name: todo-redis-replica-2
    restart: unless-stopped

    environment:
      REDISCLI_AUTH: "${REDIS_PASSWORD}"

    command:
      [
        "redis-server",
        "/usr/local/etc/redis/redis.conf",
      ]

    depends_on:
      redis-primary:
        condition: service_healthy

    ports:
      - "6381:6381"

    volumes:
      - redis_replica_2_data:/data
      - ./redis/replica-2.conf:/usr/local/etc/redis/redis.conf:ro

    healthcheck:
      test: ["CMD", "redis-cli",  "-p", "6381", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  sentinel-1:
    image: redis:8-alpine
    container_name: todo-sentinel-1
    restart: unless-stopped

    depends_on:
      redis-primary:
        condition: service_healthy

    command:
      [
        "sh",
        "-c",
        "cp /config/sentinel.conf /tmp/sentinel.conf && redis-sentinel /tmp/sentinel.conf"
      ]

    ports:
      - "26379:26379"

    volumes:
      - ./redis/sentinel/sentinel-1.conf:/config/sentinel.conf:ro

  sentinel-2:
    image: redis:8-alpine
    container_name: todo-sentinel-2
    restart: unless-stopped

    depends_on:
      redis-primary:
        condition: service_healthy

    command:
      [
        "sh",
        "-c",
        "cp /config/sentinel.conf /tmp/sentinel.conf && redis-sentinel /tmp/sentinel.conf"
      ]

    ports:
      - "26380:26380"

    volumes:
      - ./redis/sentinel/sentinel-2.conf:/config/sentinel.conf:ro

  sentinel-3:
    image: redis:8-alpine
    container_name: todo-sentinel-3
    restart: unless-stopped

    depends_on:
      redis-primary:
        condition: service_healthy

    command:
      [
        "sh",
        "-c",
        "cp /config/sentinel.conf /tmp/sentinel.conf && redis-sentinel /tmp/sentinel.conf"
      ]

    ports:
      - "26381:26381"

    volumes:
      - ./redis/sentinel/sentinel-3.conf:/config/sentinel.conf:ro

volumes:
  postgres_data:
  redis_data:
  redis_replica_1_data:
  redis_replica_2_data:
