services:
  postgres:
    image: postgres:18-alpine
    container_name: todo-postgres

    restart: unless-stopped

    environment:
      POSTGRES_USER: todo_user
      POSTGRES_PASSWORD: todo_password
      POSTGRES_DB: todo_db

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U todo_user -d todo_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis-primary:
    image: redis:8-alpine
    container_name: todo-redis-primary
    restart: unless-stopped

    environment:
      REDIS_ADMIN_PASSWORD:
        ${REDIS_ADMIN_PASSWORD}

    command:
      [
        "redis-server",
        "/usr/local/etc/redis/redis.conf",
      ]

    ports:
      - "127.0.0.1:6379:6379"

    volumes:
      - redis_data:/data
      - ./redis/primary.conf:/usr/local/etc/redis/redis.conf:ro
      - ./redis/runtime/users.acl:/usr/local/etc/redis/runtime/users.acl:ro

    healthcheck:
      test: [
        "CMD-SHELL",
        "REDISCLI_AUTH=$$REDIS_ADMIN_PASSWORD redis-cli --user redis-admin -p 6379 PING | grep PONG"
      ]
      interval: 5s
      timeout: 3s
      retries: 5

  redis-replica-1:
    image: redis:8-alpine
    container_name: todo-redis-replica-1
    restart: unless-stopped

    depends_on:
      redis-primary:
        condition: service_healthy

    environment:
      REDIS_REPLICA_PASSWORD:
        ${REDIS_REPLICA_PASSWORD}

      REDIS_ADMIN_PASSWORD:
        ${REDIS_ADMIN_PASSWORD}

    command:
      [
        "sh",
        "-c",
        "exec redis-server /usr/local/etc/redis/redis.conf --masterauth \"$$REDIS_REPLICA_PASSWORD\""
      ]    

    ports:
      - "127.0.0.1:6380:6380"

    volumes:
      - redis_replica_1_data:/data
      - ./redis/replica-1.conf:/usr/local/etc/redis/redis.conf:ro
      - ./redis/runtime/users.acl:/usr/local/etc/redis/users.acl:ro

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "REDISCLI_AUTH=$$REDIS_ADMIN_PASSWORD redis-cli --user redis-admin -p 6380 PING | grep PONG"
        ]
      interval: 5s
      timeout: 3s
      retries: 5

  redis-replica-2:
    image: redis:8-alpine
    container_name: todo-redis-replica-2
    restart: unless-stopped

    depends_on:
      redis-primary:
        condition: service_healthy

    environment:
      REDIS_REPLICA_PASSWORD:
        ${REDIS_REPLICA_PASSWORD}

      REDIS_ADMIN_PASSWORD:
        ${REDIS_ADMIN_PASSWORD}

    command:
      [
        "sh",
        "-c",
        "exec redis-server /usr/local/etc/redis/redis.conf --masterauth \"$$REDIS_REPLICA_PASSWORD\""
      ]

    ports:
      - "127.0.0.1:6381:6381"

    volumes:
      - redis_replica_2_data:/data
      - ./redis/replica-2.conf:/usr/local/etc/redis/redis.conf:ro
      - ./redis/runtime/users.acl:/usr/local/etc/redis/users.acl:ro

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "REDISCLI_AUTH=$$REDIS_ADMIN_PASSWORD redis-cli --user redis-admin -p 6381 PING | grep PONG"
        ]
      interval: 5s
      timeout: 3s
      retries: 5

  sentinel-1:
    image: redis:8-alpine
    container_name: todo-sentinel-1
    restart: unless-stopped

    depends_on:
      redis-primary:
        condition: service_healthy

    command:
      [
        "sh",
        "-c",
        "cp /config/sentinel.conf /tmp/sentinel.conf && redis-sentinel /tmp/sentinel.conf"
      ]

    ports:
      - "127.0.0.1:26379:26379"

    volumes:
      - ./redis/sentinel/sentinel-1.conf:/config/sentinel.conf:ro

  sentinel-2:
    image: redis:8-alpine
    container_name: todo-sentinel-2
    restart: unless-stopped

    depends_on:
      redis-primary:
        condition: service_healthy

    command:
      [
        "sh",
        "-c",
        "cp /config/sentinel.conf /tmp/sentinel.conf && redis-sentinel /tmp/sentinel.conf"
      ]

    ports:
      - "127.0.0.1:26380:26380"

    volumes:
      - ./redis/sentinel/sentinel-2.conf:/config/sentinel.conf:ro

  sentinel-3:
    image: redis:8-alpine
    container_name: todo-sentinel-3
    restart: unless-stopped

    depends_on:
      redis-primary:
        condition: service_healthy

    command:
      [
        "sh",
        "-c",
        "cp /config/sentinel.conf /tmp/sentinel.conf && redis-sentinel /tmp/sentinel.conf"
      ]

    ports:
      - "127.0.0.1:26381:26381"

    volumes:
      - ./redis/sentinel/sentinel-3.conf:/config/sentinel.conf:ro

volumes:
  postgres_data:
  redis_data:
  redis_replica_1_data:
  redis_replica_2_data:
